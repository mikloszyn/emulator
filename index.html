<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>NDS GitHub Player</title>
    <style>
        body { background: #0a0a0c; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 800px; background: #16161e; padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        #game { width: 100%; height: 500px; background: #000; border-radius: 10px; margin-top: 20px; }
        .btn { background: #00f2ff; color: black; padding: 12px 24px; border-radius: 50px; cursor: pointer; font-weight: bold; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>NDS Player (GitHub Edition)</h2>
        <input type="file" id="file-in" accept=".nds" style="display:none">
        <button class="btn" onclick="document.getElementById('file-in').click()">WYBIERZ GRĘ .NDS</button>
        <div id="game"><div id="ejs-player"></div></div>
    </div>

    <script>
        // REJESTRACJA SERVICE WORKERA (Naprawa nagłówków)
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").then(() => {
                console.log("Service Worker Active - Nagłówki COOP/COEP odblokowane");
            });
        }

        const fileIn = document.getElementById('file-in');
        fileIn.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            window.EJS_player = '#ejs-player';
            window.EJS_core = 'nds'; 
            window.EJS_gameUrl = URL.createObjectURL(file);
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
