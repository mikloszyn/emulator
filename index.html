<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDS Emulator Web</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="ui">
  <input type="file" id="romInput" accept=".nds">

  <select id="lang">
    <option value="pl">PL</option>
    <option value="en">EN</option>
  </select>

  <select id="mode">
    <option value="vertical">DS (pion)</option>
    <option value="horizontal">poziom</option>
  </select>

  <button id="startBtn">START</button>
  <button id="shotBtn">📸</button>
</div>

<canvas id="screen" width="256" height="384"></canvas>

<div id="controls">
  <button data-k="UP">↑</button>
  <button data-k="DOWN">↓</button>
  <button data-k="LEFT">←</button>
  <button data-k="RIGHT">→</button>
  <button data-k="A">A</button>
  <button data-k="B">B</button>
  <button data-k="X">X</button>
  <button data-k="Y">Y</button>
</div>

<script src="app.js"></script>
</body>
</html>
