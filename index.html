<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDS Mobile Player</title>
    <style>
        body { background: #0a0a0c; color: white; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 95%; max-width: 800px; background: #16161e; padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; box-sizing: border-box; }
        #game { width: 100%; height: 500px; background: #000; border-radius: 10px; margin-top: 20px; position: relative; }
        .btn { background: #00f2ff; color: black; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; border: none; font-size: 16px; }
        #status { margin-bottom: 10px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <h2>NDS Player</h2>
        <div id="status">Inicjalizacja systemu...</div>
        <input type="file" id="file-in" accept=".nds" style="display:none">
        <button id="main-btn" class="btn" style="display:none" onclick="document.getElementById('file-in').click()">WYBIERZ GRĘ .NDS</button>
        
        <div id="game">
            <div id="ejs-player"></div>
        </div>
    </div>

    <script>
        const status = document.getElementById('status');
        const btn = document.getElementById('main-btn');

        // FUNKCJA NAPRAWCZA DLA SAFARI I GITHUB
        async function setupServiceWorker() {
            if ("serviceWorker" in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register("sw.js");
                    console.log("SW zarejestrowany");
                    
                    // Jeśli to pierwsze uruchomienie, musimy przeładować stronę
                    if (!navigator.serviceWorker.controller) {
                        status.innerText = "Konfiguracja... Odświeżam za sekundę";
                        setTimeout(() => location.reload(), 1000);
                        return;
                    }
                    
                    status.innerText = "System gotowy";
                    btn.style.display = "inline-block";
                } catch (err) {
                    status.innerText = "Błąd SW: " + err.message;
                }
            } else {
                status.innerText = "Twoja przeglądarka nie wspiera emulatora.";
            }
        }

        setupServiceWorker();

        document.getElementById('file-in').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            status.innerText = "Ładowanie: " + file.name;
            
            window.EJS_player = '#ejs-player';
            window.EJS_core = 'nds'; 
            window.EJS_gameUrl = URL.createObjectURL(file);
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
