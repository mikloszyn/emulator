<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari NDS Player</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #container { width: 100%; max-width: 800px; margin: auto; }
        #player { width: 100%; height: 600px; border: 2px solid #333; background: #000; }
        .controls { background: #222; padding: 15px; border-radius: 10px; margin-top: 10px; }
        input[type="file"] { margin: 10px 0; color: #aaa; }
        .warning { color: #ffcc00; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="container">
        <h1>Emulator Nintendo DS</h1>
        <p>Załaduj swój plik <b>.nds</b>, aby rozpocząć grę.</p>

        <!-- Kontener na emulator -->
        <div id="player">
            <div style="padding-top: 250px;">Wybierz plik z grą poniżej...</div>
        </div>

        <div class="controls">
            <input type="file" id="file-input" accept=".nds">
            <p class="warning">Uwaga: Safari może wymagać potwierdzenia interakcji (kliknięcia w ekran), aby odtworzyć dźwięk.</p>
        </div>
    </div>

    <!-- Integracja z zewnętrznym silnikiem emulatora (EmulatorJS) -->
    <script>
        const fileInput = document.getElementById('file-input');
        const player = document.getElementById('player');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const romData = event.target.result;
                
                // Czyścimy kontener i budujemy ramkę emulatora
                player.innerHTML = '<iframe id="emu-frame" src="https://emulatorjs.org/emu.html?system=nds" style="width:100%; height:100%; border:none;"></iframe>';
                
                // Uwaga: W prawdziwym środowisku produkcyjnym dane ROM przesyła się przez postMessage 
                // do instancji WebAssembly. 
                status.innerText = "Ładowanie rdzenia NDS...";
            };
            reader.readAsArrayBuffer(file);
            
            // Informacja o ograniczeniach
            alert("Aby uruchomić Animal Crossing w Safari, potrzebujesz potężnego silnika JIT. \n\nZalecam skorzystanie z gotowej strony 'DS Player' lub 'DeSmuME Online', ponieważ Safari blokuje niektóre funkcje optymalizacji kodu (JIT) dla plików lokalnych.");
        });
    </script>
</body>
</html>
