<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>NDS Fix for Safari</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        #status-box { border: 1px solid #333; padding: 20px; border-radius: 10px; background: #111; margin-bottom: 20px; }
        .ready { color: #00ff00; }
        .loading { color: #ffcc00; }
        #game-area { width: 100%; max-width: 800px; height: 600px; margin: 0 auto; background: #050505; position: relative; }
        .btn { background: #00f2ff; color: #000; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; display: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status-box">
        <h2>Konsola NDS</h2>
        <p id="msg" class="loading">Sprawdzanie Service Workera...</p>
        <button id="start-btn" class="btn" onclick="document.getElementById('inp').click()">WYBIERZ PLIK .NDS</button>
        <input type="file" id="inp" accept=".nds" style="display:none">
    </div>

    <div id="game-area">
        <div id="player"></div>
    </div>

    <script>
        const msg = document.getElementById('msg');
        const btn = document.getElementById('start-btn');

        async function initSystem() {
            if (!("serviceWorker" in navigator)) {
                msg.innerText = "Safari jest za stare lub zablokowane.";
                return;
            }

            const reg = await navigator.serviceWorker.register('sw.js');
            
            // Czekamy na aktywny kontroler
            if (!navigator.serviceWorker.controller) {
                msg.innerText = "Aktywacja zabezpieczeń... Czekaj.";
                location.reload(); // Safari MUSI się przeładować, żeby SW zaczął działać
                return;
            }

            msg.innerText = "System gotowy! Możesz wczytać grę.";
            msg.className = "ready";
            btn.style.display = "inline-block";
        }

        initSystem();

        document.getElementById('inp').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            msg.innerText = "Ładowanie rdzenia emulatora... (może to potrwać 30s)";
            
            window.EJS_player = '#player';
            window.EJS_core = 'nds'; 
            window.EJS_gameUrl = URL.createObjectURL(file);
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;

            const s = document.createElement('script');
            s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.head.appendChild(s);
        };
    </script>
</body>
</html>
