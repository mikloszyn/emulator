<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>NDS Fix</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #player-container { width: 100%; max-width: 600px; height: 400px; background: #111; border: 2px solid #333; }
        .controls { margin-top: 20px; }
        .btn { background: #00f2ff; color: #000; padding: 20px; border-radius: 10px; font-weight: bold; border: none; width: 250px; }
    </style>
</head>
<body>

    <div id="status">Inicjalizacja...</div>
    
    <div class="controls">
        <input type="file" id="file" accept=".nds" style="display:none">
        <button class="btn" id="load-btn" style="display:none" onclick="document.getElementById('file').click()">OTWÓRZ PLIK .NDS</button>
    </div>

    <div id="player-container">
        <div id="game"></div>
    </div>

    <script>
        // Sprawdzenie czy Service Worker działa
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                if (!navigator.serviceWorker.controller) {
                    // Krytyczne dla Safari: musi być reload po rejestracji SW
                    window.location.reload();
                } else {
                    document.getElementById('status').innerText = "System Gotowy (Safari)";
                    document.getElementById('load-btn').style.display = "block";
                }
            });
        }

        document.getElementById('file').onchange = function(e) {
            const file = e.target.files[0];
            if(!file) return;

            document.getElementById('status').innerText = "Pobieranie silnika NDS...";

            window.EJS_player = '#game';
            window.EJS_core = 'nds'; // Możesz spróbować zmienić na 'desmume2015' jeśli nie ruszy
            window.EJS_gameUrl = URL.createObjectURL(file);
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;
            // Safari fix: wyłączenie SharedArrayBuffer jeśli to możliwe
            window.EJS_threads = false; 

            const loader = document.createElement('script');
            loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.head.appendChild(loader);
        };
    </script>
</body>
</html>
