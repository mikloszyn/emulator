<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NDS Cloud Player</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .container { padding: 20px; }
        #game-box { width: 100%; max-width: 600px; height: 450px; background: #111; margin: 20px auto; border: 1px solid #444; }
        .btn { background: #00f2ff; color: #000; padding: 15px 30px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
        #status { font-size: 14px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>NDS Player</h2>
    <div id="status">Sprawdzanie połączenia...</div>
    
    <input type="file" id="rom-file" accept=".nds" style="display:none">
    <button class="btn" id="load-btn" onclick="document.getElementById('rom-file').click()">OTWÓRZ GRĘ (.NDS)</button>

    <div id="game-box">
        <div id="ejs-target"></div>
    </div>
</div>

<!-- Kluczowa zmiana: Ładujemy silnik z pewniejszego źródła -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            if (!navigator.serviceWorker.controller) {
                location.reload();
            } else {
                document.getElementById('status').innerText = "System Gotowy";
            }
        });
    }

    document.getElementById('rom-file').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('status').innerText = "Wczytywanie: " + file.name;

        window.EJS_player = '#ejs-target';
        window.EJS_core = 'nds';
        window.EJS_gameUrl = URL.createObjectURL(file);
        
        // Zmieniony adres do danych - używamy wersji z GitHub Raw lub unpkg
        window.EJS_pathtodata = 'https://raw.githack.com/EmulatorJS/EmulatorJS/main/data/';
        window.EJS_startOnLoaded = true;

        const s = document.createElement('script');
        s.src = 'https://raw.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.head.appendChild(s);
    };
</script>

</body>
</html>
